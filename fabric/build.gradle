plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'maven-publish'
}
evaluationDependsOn(':common')
// Вручную прописываем то, что он потерял
project.ext.mod_id = "terrain-diffusion-mc"
project.ext.mod_name = "Terrain Diffusion"
project.ext.java_version = "21"

// Помогаем плагину 'base' найти имя архива
base {
    archivesName = "terrain-diffusion-mc-common"
}


def buildVariant = project.ext.terrainDiffusionBuildVariant

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    splitEnvironmentSourceSets()

    mods {
        "terrain-diffusion-mc" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        configureEach {
            ideConfigGenerated true
        }
        client {
            client()
            setConfigName('Fabric Client')
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            runDir('runs/server')
        }
    }
}

sourceSets {
    main {
        java {
            // Guard against stale files left by extracting older migration zips over the same working tree.
            // Fabric's main source set cannot compile net.minecraft.client classes when splitEnvironmentSourceSets() is enabled.
            exclude 'com/github/xandergos/terraindiffusionmc/client/**'
            exclude 'com/github/xandergos/terraindiffusionmc/mixin/client/**'
        }
    }
    client {
        java.srcDir project(':common').file('src/client/java')
        resources.srcDir project(':common').file('src/client/resources')
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft}:${project.parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.fabric_loader_version
    inputs.property 'build_variant', buildVariant
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'loader_version': project.fabric_loader_version
    }
    filesMatching('build-variant.properties') {
        expand 'build_variant': buildVariant
    }
}


jar {
    def licenseFile = rootProject.file('LICENSE.txt')
    if (!licenseFile.exists()) licenseFile = rootProject.file('LICENSE')
    if (licenseFile.exists()) {
        from(licenseFile) {
            rename { "${it}_${project.archivesBaseName}" }
        }
    }
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'log4j2.configurationFile', rootProject.file('log4j2-dev.xml').absolutePath
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
    }
}

tasks.register('pipelineTest', JavaExec) {
    dependsOn compileJava
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.xandergos.terraindiffusionmc.pipeline.PipelineTest'
    jvmArgs '-Xmx8g'
}

// --- ПРАВИЛА СОВМЕСТИМОСТИ GRADLE ---
def loaderAttr = Attribute.of('io.github.mcgradleconventions.loader', String)
def envAttr = Attribute.of('net.fabricmc.loom.environment', Named)

class LoaderRule implements org.gradle.api.attributes.AttributeCompatibilityRule<String> {
    void execute(org.gradle.api.attributes.CompatibilityCheckDetails<String> details) {
        if (details.producerValue == 'common') details.compatible()
    }
}
class EnvRule implements org.gradle.api.attributes.AttributeCompatibilityRule<Named> {
    void execute(org.gradle.api.attributes.CompatibilityCheckDetails<Named> details) {
        if (details.producerValue.name == 'common') details.compatible()
    }
}

dependencies.attributesSchema {
    attribute(loaderAttr) { compatibilityRules.add(LoaderRule) }
    attribute(envAttr) { compatibilityRules.add(EnvRule) }
}

// --- СТАНДАРТНЫЕ АТРИБУТЫ FABRIC ---
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
configurations.configureEach { conf ->
    if (conf.name in ['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath']) {
        conf.attributes { attribute(loaderAttribute, 'fabric') }
    }
}
sourceSets.configureEach { srcSet ->
    def configNames = [srcSet.compileClasspathConfigurationName, srcSet.runtimeClasspathConfigurationName]
    configurations.configureEach { conf ->
        if (conf.name in configNames) {
            conf.attributes { attribute(loaderAttribute, 'fabric') }
        }
    }
}
loom.remapConfigurations.configureEach { remapConf ->
    configurations.configureEach { conf ->
        if (conf.name == remapConf.name) {
            conf.attributes { attribute(loaderAttribute, 'fabric') }
        }
    }
}