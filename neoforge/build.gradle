plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}
evaluationDependsOn(':common')
neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', fml_mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.fml_mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }
    mods {
        "${fml_mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }



// --- ПРАВИЛА СОВМЕСТИМОСТИ GRADLE ---
def loaderAttr = Attribute.of('io.github.mcgradleconventions.loader', String)
def envAttr = Attribute.of('net.fabricmc.loom.environment', Named)

class LoaderRule implements org.gradle.api.attributes.AttributeCompatibilityRule<String> {
    void execute(org.gradle.api.attributes.CompatibilityCheckDetails<String> details) {
        if (details.producerValue == 'common') details.compatible()
    }
}
class EnvRule implements org.gradle.api.attributes.AttributeCompatibilityRule<Named> {
    void execute(org.gradle.api.attributes.CompatibilityCheckDetails<Named> details) {
        if (details.producerValue.name == 'common') details.compatible()
    }
}

dependencies.attributesSchema {
    attribute(loaderAttr) { compatibilityRules.add(LoaderRule) }
    attribute(envAttr) { compatibilityRules.add(EnvRule) }
}

// --- СТАНДАРТНЫЕ АТРИБУТЫ NEOFORGE ---
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
configurations.configureEach { conf ->
    if (conf.name in ['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements']) {
        conf.attributes { attribute(loaderAttribute, 'neoforge') }
    }
}
sourceSets.configureEach { srcSet ->
    def configNames = [srcSet.compileClasspathConfigurationName, srcSet.runtimeClasspathConfigurationName, srcSet.getTaskName(null, 'jarJar')]
    configurations.configureEach { conf ->
        if (conf.name in configNames) {
            conf.attributes { attribute(loaderAttribute, 'neoforge') }
        }
    }
}